<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find The Bats - 3am</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="intro-screen">
        <div class="dialogue-box">
            <h2>The Witch's Requirement</h2>
            <p>Hehehe, My couldron needs a fresh batch of ingredients tonight! Catch 10 bats for me in the dark so i can make my ultimate potion to rule the spooky world. Use your flashlight to find them!</p>
            <button id="start-btn">Start The Hunt</button>
        </div>
    </div>
    <div id="score-counter">Bats: <span id="current-score">0</span>/10</div>
    <div id="bats-container"></div>
    <div id="game-world"></div>
    <div id="flashlight-overlay"></div>

    <script src="script.js"></script>
</body>
</html>
